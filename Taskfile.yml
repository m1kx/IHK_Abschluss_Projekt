version: "3"

tasks:
  dev:
    desc: Run with live reload (air in docker compose)
    cmds:
      - docker compose up --build

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint (same as CI)
    cmds:
      - golangci-lint run ./...

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - docker compose run --rm migrate up

  migrate:down:
    desc: Roll back the last migration
    cmds:
      - docker compose run --rm migrate down 1

  migrate:create:
    desc: "Create a new migration pair (task migrate:create -- <name>)"
    cmds:
      - docker compose run --rm --no-deps migrate create -ext sql -dir /migrations -seq {{.CLI_ARGS}}
